# Nginx para Callcenter IA.
#
# Este servidor ya tiene otros sitios en los puertos 80 y 443, así que el
# callcenter se publica en un puerto propio: 9000. Daphne escucha solo en
# 127.0.0.1:8501 y nunca se expone directo.
#
#   sudo cp deploy/callcenter.nginx.conf /etc/nginx/sites-available/callcenter
#   sudo ln -s /etc/nginx/sites-available/callcenter /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 9000/tcp
#
# Para cambiar de puerto: edita `listen` aquí y actualiza VOZ_PUBLIC_HOST y
# CSRF_TRUSTED_ORIGINS en credenciales.json con el mismo puerto.

upstream callcenter_asgi {
    server 127.0.0.1:8501;
}

server {
    listen 9000;
    listen [::]:9000;
    server_name _;

    client_max_body_size 25M;
    # Los turnos de audio son largos: no cortar el WebSocket antes de tiempo.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    access_log /var/log/nginx/callcenter-access.log;
    error_log  /var/log/nginx/callcenter-error.log;

    location /static/ {
        alias /home/callcenter/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /home/callcenter/media/;
        expires 1d;
    }

    # WebSocket de audio en tiempo real (carrier y demo del navegador).
    location /ws/ {
        proxy_pass http://callcenter_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://callcenter_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: los carriers comerciales (Twilio, Telnyx) exigen wss:// con
# certificado válido, y no se emiten certificados para una IP. Cuando haya
# dominio apuntando aquí:
#     sudo certbot --nginx -d callcenter.tudominio.com
# y en credenciales.json: "USE_SSL": true, "DOMINIO_GENERAL": "callcenter.tudominio.com"
# ---------------------------------------------------------------------------
