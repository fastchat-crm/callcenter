# Nginx para Callcenter IA.
#
# Dos formas de llegar al mismo sitio:
#   - por IP en el puerto 9000, que es como arrancó y sigue sirviendo para probar
#   - por el dominio en 80/443, que es lo que exigen los carriers comerciales
#
# Este servidor ya tiene otros sitios en 80 y 443 (fastchatdj, chatpdf). No hay
# conflicto: nginx enruta por `server_name`, así que conviven.
#
#   sudo cp deploy/callcenter-comun.conf /etc/nginx/snippets/
#   sudo cp deploy/callcenter.nginx.conf /etc/nginx/sites-available/callcenter
#   sudo ln -s /etc/nginx/sites-available/callcenter /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d callcenter.integrasoluc.net
#
# Certbot edita este archivo para agregar el bloque 443. Si lo vuelves a copiar
# desde el repositorio, hay que volver a correr certbot.

upstream callcenter_asgi {
    server 127.0.0.1:8501;
}

# Por IP, sin certificado. Se conserva porque no depende del DNS.
server {
    listen 9000;
    listen [::]:9000;
    server_name _;

    access_log /var/log/nginx/callcenter-access.log;
    error_log  /var/log/nginx/callcenter-error.log;

    include /etc/nginx/snippets/callcenter-comun.conf;
}

# Por dominio. Certbot agrega aquí el bloque 443 y la redirección.
server {
    listen 80;
    listen [::]:80;
    server_name callcenter.integrasoluc.net;

    access_log /var/log/nginx/callcenter-access.log;
    error_log  /var/log/nginx/callcenter-error.log;

    include /etc/nginx/snippets/callcenter-comun.conf;
}
