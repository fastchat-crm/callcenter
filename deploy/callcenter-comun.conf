# Reglas compartidas por el sitio en el puerto 9000 (por IP) y el del dominio.
# Se instala en /etc/nginx/snippets/callcenter-comun.conf y ambos lo incluyen,
# para que un cambio aquí valga para los dos y no se desincronicen.

client_max_body_size 25M;
# Los turnos de audio son largos: no cortar el WebSocket antes de tiempo.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

location /static/ {
    alias /home/callcenter/static/;
    expires 7d;
    access_log off;
}

location /media/ {
    alias /home/callcenter/media/;
    expires 1d;
}

# WebSocket de audio en tiempo real (carrier y demo del navegador).
location /ws/ {
    proxy_pass http://callcenter_asgi;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

location / {
    proxy_pass http://callcenter_asgi;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}
